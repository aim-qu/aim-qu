name: 石を返す
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
# READMEを書き換える流れは一本ずつ順に動かす
concurrency:
  group: readme
  cancel-in-progress: false
jobs:
  move:
    if: startsWith(github.event.issue.title, '石を返す')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      # issueのタイトルと書いた人は環境変数で渡し、スクリプトの中で形を確かめる
      - name: 石を返す
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node scripts/live/go.mjs --move > "$RUNNER_TEMP/reply.md"
      - name: 盤を書き込む
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/go.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "盤を更新（#$NUMBER）"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: 返事をして閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
