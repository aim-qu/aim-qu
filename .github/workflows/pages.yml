name: Publish playground
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/configure-pages@v6.0.0
      - name: Refresh public profile and official headlines
        continue-on-error: true
        run: node scripts/refresh-public-data.mjs
      - name: Prepare static files
        run: node scripts/prepare-site.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
